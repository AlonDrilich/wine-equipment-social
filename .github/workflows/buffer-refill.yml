name: buffer-refill

# Tops up wine.equipment reels to Buffer (YouTube + LinkedIn) as published posts free slots.
# Buffer's free plan holds ~10 scheduled/channel, so this runs daily to keep the queue full
# through Aug 31. Idempotent — queries what's already scheduled and only adds new days.
on:
  schedule:
    - cron: "0 3,9,15,21 * * *"   # every 6h — a failed run self-heals within hours, not days
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Top up Buffer queue
        env:
          BUFFER_WINE_TOKEN: ${{ secrets.BUFFER_WINE_TOKEN }}
          REEL_BASE_URL: ${{ secrets.REEL_BASE_URL }}   # optional; defaults to this repo's raw reels URL
        run: node scripts/buffer_refill.mjs

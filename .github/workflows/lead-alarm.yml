name: lead-alarm

# Hourly, in GitHub's cloud: is a wine.equipment quote request waiting? A new one opens an issue that @mentions the
# owner and fails the run; GitHub emails the owner about both. Silence means nothing is waiting.
# See scripts/lead_alarm.mjs. Only a count ever leaves the database — this repository is public.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Pretend this many requests are waiting (tests the alert; reads and changes no lead data)"
        required: false
        default: "0"

permissions:
  contents: read
  issues: write

concurrency:
  group: lead-alarm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Count waiting quote requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIMULATE: ${{ github.event.inputs.simulate }}
        run: node scripts/lead_alarm.mjs
